services:
  mineralforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineralforge_blast_vibration
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONPATH=/app/src
    command: streamlit run dashboard.py --server.address 0.0.0.0
